<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // HMR: Disabled. Ignore Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason && (
          (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('vite') !== -1)) ||
          String(reason).indexOf('WebSocket') !== -1
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.indexOf('@vite/client') !== -1) ||
          (event.message && event.message.indexOf('WebSocket') !== -1)
        ) {
          event.preventDefault();
        }
      });
    </script>
    <title>Secure Online Examination Portal</title>
    <meta name="description" content="Smart Exams. Secure Environment. Intelligent Evaluation. Professional AI-proctored online examination platform with face verification, live monitoring, timed tests, and performance analytics." />
    <meta property="og:title" content="Secure Online Examination Portal" />
    <meta property="og:description" content="Smart Exams. Secure Environment. Intelligent Evaluation. Professional AI-proctored online examination platform with face verification, live monitoring, timed tests, and performance analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 min-h-screen font-sans selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
